services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_DB: knowledge_hub
      POSTGRES_USER: knowledge_hub
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge_hub -d knowledge_hub"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
